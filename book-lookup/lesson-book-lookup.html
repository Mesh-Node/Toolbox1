<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline book lookup</title>
<style>
:root {
  --bg: #0b0d10; --fg: #d8d2c4; --dim: #8a8376; --line: #2a2e34;
  --accent: #c45c26; --ok: #7ea36b; --bad: #b54a4a; --card: #14181e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 16px/1.5 "Segoe UI", "IBM Plex Sans", sans-serif; }
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100%; }
nav { border-right: 1px solid var(--line); padding: 22px 14px 40px; }
nav h1 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
  font-weight: 650; margin: 0 0 18px; }
nav button { display: block; width: 100%; text-align: left; background: transparent; border: 0;
  color: var(--dim); padding: 9px 10px; font: 13px/1.35 inherit; cursor: pointer; }
nav button:hover, nav button:focus { color: var(--fg); outline: none; background: #1a1f26; }
nav button.on { color: var(--fg); background: #1a1f26; box-shadow: inset 2px 0 0 var(--accent); }
.stage { padding: 28px 36px 72px; max-width: 920px; }
.kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
h2 { font-size: 26px; font-weight: 650; margin: 0 0 12px; letter-spacing: -0.02em; }
.lede { color: var(--dim); max-width: 64ch; margin: 0 0 22px; }
.ask { background: var(--card); border: 1px solid var(--line); padding: 14px 16px; margin: 0 0 18px; }
.ask strong { color: var(--accent); font-weight: 650; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ok); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 7px 8px; vertical-align: top; }
th { color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.row { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
.pill { background: var(--card); border: 1px solid var(--line); padding: 12px 14px; min-width: 140px; flex: 1; }
.pill b { display: block; font-size: 22px; font-weight: 650; }
.pill span { color: var(--dim); font-size: 12px; }
.plot { position: relative; height: 380px; background: #10141a; border: 1px solid var(--line); margin: 12px 0 8px; }
.plot canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--dim); margin-bottom: 16px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
label { display: block; color: var(--dim); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 4px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.foot { margin-top: 28px; color: var(--dim); font-size: 13px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--line); padding: 1px 5px; color: var(--fg); }
.out { color: var(--bad); }
.mch { color: var(--ok); }
button.next { margin-top: 20px; background: var(--accent); color: #1a1008; border: 0; padding: 10px 16px;
  font: 650 14px inherit; cursor: pointer; }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="shell">
<nav>
  <h1>Offline book lookup</h1>
  <div id="toc"></div>
  <p class="foot"><kbd>j</kbd> / <kbd>k</kbd> next · prev</p>
  <p class="foot"><a href="../lessons/INDEX.html" style="color:#c45c26">Kit lessons</a></p>
</nav>
<main class="stage" id="stage">
  <p class="lede">Loading lessons…</p>
</main>
</div>
<script type="application/json" id="data">{"rows":[{"path":"Eastin\u2013Knill theorem","role":"first","nz25":19,"nz3":3,"sim":0.6638,"odd":0.6791},{"path":"Decoding Reality","role":"first","nz25":2,"nz3":0,"sim":0.5646,"odd":0.5293},{"path":"The Pattern on the Stone","role":"first","nz25":9,"nz3":1,"sim":0.5031,"odd":0.5907},{"path":"Quantum Computing: A Gentle Introduction","role":"first","nz25":3,"nz3":1,"sim":0.7516,"odd":0.5363},{"path":"Jiuzhang (quantum computer)","role":"first","nz25":14,"nz3":2,"sim":0.6989,"odd":0.6687},{"path":"Quantum mind","role":"first","nz25":2,"nz3":0,"sim":0.7436,"odd":0.54},{"path":"Quantum Supremacy","role":"first","nz25":0,"nz3":0,"sim":0.6745,"odd":0.4629},{"path":"Communication physics","role":"first","nz25":2,"nz3":0,"sim":0.5323,"odd":0.53},{"path":"Pusey\u2013Barrett\u2013Rudolph theorem","role":"first","nz25":31,"nz3":6,"sim":0.6028,"odd":0.7075},{"path":"Quantum machine learning","role":"first","nz25":3,"nz3":1,"sim":0.7651,"odd":0.4744},{"path":"Quantum cognition","role":"link","nz25":1,"nz3":0,"sim":0.7575,"odd":0.5333},{"path":"Delayed-choice quantum eraser","role":"link","nz25":10,"nz3":1,"sim":0.6003,"odd":0.5606},{"path":"Critical thinking","role":"link","nz25":2,"nz3":0,"sim":0.5371,"odd":0.547},{"path":"John Preskill","role":"link","nz25":4,"nz3":1,"sim":0.4664,"odd":0.5813},{"path":"Universal Turing machine","role":"link","nz25":3,"nz3":0,"sim":0.5879,"odd":0.4944},{"path":"The God Equation","role":"link","nz25":6,"nz3":2,"sim":0.5123,"odd":0.5692},{"path":"Consciousness Explained","role":"link","nz25":2,"nz3":0,"sim":0.5977,"odd":0.5205},{"path":"Hard problem of consciousness","role":"link","nz25":16,"nz3":2,"sim":0.649,"odd":0.6376},{"path":"Consistent histories","role":"link","nz25":7,"nz3":0,"sim":0.4729,"odd":0.5748},{"path":"Bloch sphere","role":"link","nz25":7,"nz3":1,"sim":0.6447,"odd":0.6007},{"path":"Global workspace theory","role":"link","nz25":28,"nz3":10,"sim":0.558,"odd":0.7321},{"path":"Sycamore (processor)","role":"link","nz25":13,"nz3":0,"sim":0.6926,"odd":0.6767},{"path":"Communication","role":"link","nz25":2,"nz3":0,"sim":0.4845,"odd":0.5339},{"path":"Quantum superposition","role":"link","nz25":1,"nz3":0,"sim":0.6624,"odd":0.488},{"path":"Michio Kaku","role":"link","nz25":7,"nz3":1,"sim":0.4463,"odd":0.5929},{"path":"Vlatko Vedral","role":"link","nz25":6,"nz3":0,"sim":0.4523,"odd":0.5897},{"path":"Logical conjunction","role":"link","nz25":0,"nz3":0,"sim":0.5155,"odd":0.5131},{"path":"Bell test","role":"link","nz25":6,"nz3":1,"sim":0.531,"odd":0.5201},{"path":"Quantum speed limit","role":"link","nz25":6,"nz3":0,"sim":0.6985,"odd":0.5928},{"path":"Nonverbal communication","role":"link","nz25":3,"nz3":0,"sim":0.4708,"odd":0.5569},{"path":"Transactional interpretation","role":"link","nz25":8,"nz3":1,"sim":0.5134,"odd":0.607},{"path":"Metaphor","role":"link","nz25":8,"nz3":1,"sim":0.476,"odd":0.5935},{"path":"Visions (book)","role":"link","nz25":4,"nz3":0,"sim":0.4928,"odd":0.5791},{"path":"Density matrix","role":"link","nz25":5,"nz3":0,"sim":0.5104,"odd":0.5708},{"path":"Space complexity","role":"link","nz25":25,"nz3":3,"sim":0.6013,"odd":0.6696},{"path":"Writing","role":"link","nz25":5,"nz3":0,"sim":0.5538,"odd":0.528},{"path":"Science book","role":"link","nz25":4,"nz3":1,"sim":0.5879,"odd":0.5478},{"path":"Einstein\u2013Podolsky\u2013Rosen paradox","role":"link","nz25":3,"nz3":0,"sim":0.5044,"odd":0.5863},{"path":"Entanglement-assisted classical capacity","role":"link","nz25":11,"nz3":1,"sim":0.5564,"odd":0.5542},{"path":"Glossary of elementary quantum mechanics","role":"link","nz25":3,"nz3":0,"sim":0.6376,"odd":0.5647},{"path":"Cloud-based quantum computing","role":"link","nz25":21,"nz3":5,"sim":0.7558,"odd":0.7069},{"path":"Manuel Castells","role":"link","nz25":21,"nz3":9,"sim":0.3725,"odd":0.6529},{"path":"Quantum counting algorithm","role":"link","nz25":14,"nz3":6,"sim":0.7262,"odd":0.6767},{"path":"Dendrite","role":"link","nz25":9,"nz3":2,"sim":0.5042,"odd":0.5692},{"path":"Telecommunications","role":"link","nz25":12,"nz3":1,"sim":0.5913,"odd":0.5434},{"path":"Quantum capacity","role":"link","nz25":14,"nz3":3,"sim":0.7229,"odd":0.6227},{"path":"Chinese language","role":"link","nz25":9,"nz3":3,"sim":0.4521,"odd":0.5968},{"path":"Spacetime","role":"link","nz25":5,"nz3":2,"sim":0.494,"odd":0.5307},{"path":"Reversible computing","role":"link","nz25":12,"nz3":2,"sim":0.7348,"odd":0.6154},{"path":"Media ecology","role":"link","nz25":6,"nz3":2,"sim":0.4237,"odd":0.6002}],"ham":[{"path":"Quantum computing","role":"link","disagree":152,"sim":0.8377},{"path":"Quantum machine learning","role":"first","disagree":157,"sim":0.7647},{"path":"Quantum logic gate","role":"link","disagree":161,"sim":0.7863},{"path":"Quantum Computing: A Gentle Introduction","role":"first","disagree":162,"sim":0.7516},{"path":"Quantum mind","role":"first","disagree":178,"sim":0.744},{"path":"Quantum network","role":"link","disagree":180,"sim":0.7318},{"path":"Jiuzhang (quantum computer)","role":"first","disagree":191,"sim":0.6992},{"path":"Quantum Supremacy","role":"first","disagree":194,"sim":0.6745},{"path":"Quantum circuit","role":"link","disagree":194,"sim":0.695},{"path":"Quantum programming","role":"link","disagree":194,"sim":0.7054},{"path":"Eastin\u2013Knill theorem","role":"first","disagree":205,"sim":0.6638},{"path":"Pusey\u2013Barrett\u2013Rudolph theorem","role":"first","disagree":224,"sim":0.6028},{"path":"Decoding Reality","role":"first","disagree":229,"sim":0.5646},{"path":"Communication physics","role":"first","disagree":238,"sim":0.5323},{"path":"The Pattern on the Stone","role":"first","disagree":254,"sim":0.5031}]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var ROWS = DATA.rows;
  var HAM = DATA.ham;

  var LESSONS = [
    { id:"knobs", title:"Two settings", kicker:"Search",
      lede:"When you look something up in a local encyclopedia, two settings matter. How many articles to open. How much of each article to read. Everything else happens after that.",
      ask:"If you type the same words into the same copy of the encyclopedia, what should you get?",
      html: '<div class="row"><div class="pill"><b>How many articles</b><span>this encyclopedia returns 10 titles per search</span></div><div class="pill"><b>How much to read</b><span>about 12,000 characters each, then split into short pieces</span></div></div><p class="lede">Same words, same book, same 10 titles. Every time. A typo is not “close enough” — it is a different search.</p>' },

    { id:"exact", title:"You search with exact words", kicker:"Search",
      lede:"The search box does not guess what you meant. It looks for the words you typed, including misspellings.",
      ask:"Why did “going to chrash” find nothing, while “going to crash” found 10 articles?",
      html: '<table><thead><tr><th>What you typed</th><th>What came back</th></tr></thead><tbody><tr><td class="mono">… chrash?</td><td>nothing</td></tr><tr><td class="mono">… crash?</td><td>10 articles about stock-market crashes</td></tr><tr><td class="mono">economy crash</td><td>a different 10 — a book, Dubai, Latvia. Only one title in common with the full sentence.</td></tr></tbody></table><p class="lede">Changing one letter, or dropping “is the American…”, is a new search. That is a feature: the tool is repeatable.</p>' },

    { id:"expand", title:"The first 10 are a starting list", kicker:"Follow links",
      lede:"A search for “Explain quantum computing” did not even return the article named Quantum computing. Following the links on those 10 pages did.",
      ask:"If the obvious article is missing from the first 10, did search fail?",
      html: '<div class="row"><div class="pill"><b>10</b><span>articles from the search</span></div><div class="pill"><b>420</b><span>more articles reached by following links</span></div><div class="pill"><b>3,768</b><span>short pieces, all compared to the question</span></div></div><p class="lede">The closest pieces to the question came from the linked articles, not from the first 10. The first 10 are a scout, not the whole answer.</p>' },

    { id:"thumb", title:"Each piece gets a fingerprint", kicker:"Meaning as numbers",
      lede:"Each short piece of an article is turned into 768 numbers. Together they are a fingerprint of meaning. Close fingerprints usually mean similar topics. The 768 slots are not labeled “physics” or “history.” They are just 768 measurements.",
      ask:"If measurement 342 differs most between two groups of articles, what is 342 called?",
      html: '<p class="lede">Nothing you can read. It is not a named idea. Do not treat one slot as a topic. Later you can mark each measurement only as plus or minus. Until then, leave the raw numbers alone.</p><p class="lede">In this set, the spread of each measurement was almost the same. The cloud of articles is more like a ball than a Rubik’s cube with 768 different faces.</p>' },

    { id:"score", title:"A high score is not an answer", kicker:"Compare",
      lede:"We score how similar a piece is to your question (0 to 1, higher is closer). A high score on the wrong article is still the wrong article. Always read the title.",
      ask:"A page about snakes shedding skin scored 0.63 against “why do dogs eat grass.” Was that a good find?",
      html: '<p class="lede">No. The search had grabbed pages that shared words like eat and grass. Similarity cannot fix a bad starting list. Later, a page about animals that eat grass scored higher — and still did not explain pet dogs.</p>' },

    { id:"disagree", title:"A second way to count “how different”", kicker:"Agree / disagree",
      lede:"For each of the 768 measurements, ask only: is it positive or negative? That is 768 yes/no bits. Compare two fingerprints by counting how many bits disagree. Same idea as “how many stickers are the wrong color” on a cube — not spinning a face.",
      ask:"Does counting disagreements rank articles the same way as the similarity score?",
      html: '<p class="lede">On 15 articles versus the question, almost. Quantum computing disagreed in 152 of 768 bits (similarity 0.84). A popular science book disagreed in 254 bits (similarity 0.50). The moves are still “open this article,” not “twist axis 17.”</p><div id="hamtable"></div>' },

    { id:"mu", title:"The average of the pile", kicker:"Typical",
      lede:"Take every article in your working set and average the 768 measurements. That average is one fingerprint: “what this pile is like.” Distance from that average means “how typical of this pile,” not “how well it answers the question.”",
      ask:"If you average every piece including leftover website junk, what happens to the odd articles?",
      html: '<p class="lede">They disappear into the average. Build the average from the starting articles only, then judge the linked articles against that. Do not dump the whole pile into one fingerprint and call it the answer.</p><div class="row"><div class="pill"><b>0.77</b><span>starting-list average vs the question</span></div><div class="pill"><b>0.81</b><span>key linked articles vs the question</span></div><div class="pill"><b>0.94</b><span>those two averages vs each other — same neighborhood</span></div></div>' },

    { id:"two", title:"Two questions, two lists", kicker:"Typical vs on-topic",
      lede:"“Is this like the other articles we already have?” is not the same as “does this speak to the question?” A page can be ordinary in the pile and still miss the question. Another can be unusual in the pile and still be on topic.",
      ask:"Do you want “same kind of article as the rest,” or “about the question”?",
      html: '<table><thead><tr><th></th><th>like the rest of the pile</th><th>unlike the rest of the pile</th></tr></thead><tbody><tr><td>about the question</td><td class="mch">on-topic and typical</td><td>on-topic but unusual (a specific chip, a hard theorem)</td></tr><tr><td>not about the question</td><td>ordinary leftover pages</td><td class="out">a stray topic that snuck in</td></tr></tbody></table><p class="lede">Keep these as two lists. Do not add the scores together and pretend they are one number.</p>' },

    { id:"lab", title:"Lab: what counts as unusual", kicker:"Try it",
      lede:"Each dot is a real article from a search about quantum computing. Right = closer to the question. Up = more unusual compared with this pile. Drag the sliders. Typical stays green or blue. Unusual turns red.",
      ask:"With the sliders at 2.5 and 10, which starting articles turn red? Read those titles before you keep them.",
      html: '<label>How picky is “unusual”? <span class="mono" id="kv">2.5</span> · higher = fewer red dots</label><input id="k" type="range" min="1.5" max="4" step="0.1" value="2.5"><label>How many odd measurements before we call the article unusual? <span class="mono" id="mv">10</span> of 768</label><input id="m" type="range" min="0" max="40" step="1" value="10"><div class="plot"><canvas id="cv" width="860" height="380"></canvas></div><div class="legend"><span><i class="dot" style="background:#6a8caf"></i>from the first search</span><span><i class="dot" style="background:#7ea36b"></i>from following links, typical</span><span><i class="dot" style="background:#b54a4a"></i>unusual under these settings</span></div><div id="lists" class="row"></div><p class="lede">Left-right is “about the question.” Up-down is “like the rest of this pile.” Those are different judgments. The sliders only change the second one.</p>' }
  ];

  var toc = document.getElementById("toc");
  var stage = document.getElementById("stage");
  var i = Number(localStorage.getItem("kit-book-lookup") || 0);
  if (!(i >= 0 && i < LESSONS.length)) i = 0;

  function render() {
    localStorage.setItem("kit-book-lookup", String(i));
    var buttons = toc.querySelectorAll("button");
    for (var n = 0; n < buttons.length; n++) buttons[n].classList.toggle("on", n === i);
    var L = LESSONS[i];
    stage.innerHTML = '<p class="kicker">' + L.kicker + " · " + (i + 1) + "/" + LESSONS.length + "</p>" +
      "<h2>" + L.title + "</h2>" +
      '<p class="lede">' + L.lede + "</p>" +
      '<div class="ask"><strong>Pause here.</strong> ' + L.ask + "</div>" +
      L.html +
      '<button class="next" type="button">' + (i < LESSONS.length - 1 ? "Next lesson" : "Back to the start") + "</button>";
    stage.querySelector(".next").onclick = function () { i = (i + 1) % LESSONS.length; render(); };
    if (L.id === "disagree") hamtable();
    if (L.id === "lab") lab();
  }

  function kind(role) {
    return role === "first" ? "first search" : "from a link";
  }

  function hamtable() {
    var copy = HAM.slice().sort(function (a, b) { return a.disagree - b.disagree; });
    var rows = copy.map(function (h) {
      return "<tr><td class=mono>" + h.disagree + "</td><td class=mono>" + h.sim.toFixed(2) + "</td><td>" + kind(h.role) + "</td><td class=mono>" + h.path + "</td></tr>";
    }).join("");
    document.getElementById("hamtable").innerHTML = "<table><thead><tr><th>bits that disagree (of 768)</th><th>similarity to the question</th><th>how we found it</th><th>article</th></tr></thead><tbody>" + rows + "</tbody></table>";
  }

  LESSONS.forEach(function (L, n) {
    var b = document.createElement("button");
    b.textContent = (n + 1) + ". " + L.title;
    b.onclick = function () { i = n; render(); };
    toc.appendChild(b);
  });

  function nz(r, k) {
    if (Math.abs(k - 2.5) < 1e-6) return r.nz25;
    if (Math.abs(k - 3) < 1e-6) return r.nz3;
    var t = (k - 2.5) / 0.5;
    return r.nz25 + t * (r.nz3 - r.nz25);
  }

  function lab() {
    var canvas = document.getElementById("cv");
    var ctx = canvas.getContext("2d");
    var kEl = document.getElementById("k");
    var mEl = document.getElementById("m");
    function draw() {
      var k = +kEl.value, m = +mEl.value;
      document.getElementById("kv").textContent = k.toFixed(1);
      document.getElementById("mv").textContent = String(m);
      var W = canvas.width, H = canvas.height;
      ctx.fillStyle = "#10141a"; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#2a2e34"; ctx.beginPath();
      ctx.moveTo(48, H - 36); ctx.lineTo(W - 16, H - 36);
      ctx.moveTo(48, H - 36); ctx.lineTo(48, 16); ctx.stroke();
      ctx.fillStyle = "#8a8376"; ctx.font = "11px ui-monospace, monospace";
      ctx.fillText("more like the question →", W / 2 - 70, H - 12);
      ctx.save();
      ctx.translate(14, H / 2 + 70);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("more unusual ↑", 0, 0);
      ctx.restore();
      var xmin = 0.48, xmax = 0.82, ymin = 0.44, ymax = 0.76;
      function x(v) { return 48 + (v - xmin) / (xmax - xmin) * (W - 64); }
      function y(v) { return (H - 36) - (v - ymin) / (ymax - ymin) * (H - 56); }
      var match = [], out = [];
      ROWS.forEach(function (r) {
        var z = nz(r, k);
        var outlier = z >= m;
        (outlier ? out : match).push(r);
        ctx.beginPath();
        ctx.arc(x(r.sim), y(r.odd), r.role === "first" ? 6 : 4, 0, Math.PI * 2);
        ctx.fillStyle = outlier ? "#b54a4a" : (r.role === "first" ? "#6a8caf" : "#7ea36b");
        ctx.fill();
      });
      function fmt(arr) {
        return arr.slice().sort(function (a, b) { return b.nz25 - a.nz25; }).slice(0, 8).map(function (r) {
          return '<div><span class="mono">' + r.path + "</span> · " + kind(r.role) + " · " + nz(r, k).toFixed(0) + " odd measurements</div>";
        }).join("");
      }
      document.getElementById("lists").innerHTML =
        '<div class="pill"><span class="mch">Typical (' + match.length + ")</span>" + (fmt(match) || "<div>—</div>") + "</div>" +
        '<div class="pill"><span class="out">Unusual (' + out.length + ")</span>" + (fmt(out) || "<div>—</div>") + "</div>";
    }
    kEl.oninput = draw;
    mEl.oninput = draw;
    draw();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "j" || e.key === "ArrowRight") { i = Math.min(LESSONS.length - 1, i + 1); render(); }
    if (e.key === "k" || e.key === "ArrowLeft") { i = Math.max(0, i - 1); render(); }
  });
  render();
})();
</script>
</body>
</html>
