<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search, then open the page</title>
<style>
:root {
  --bg:#0b0d10; --fg:#d8d2c4; --dim:#8a8376; --line:#2a2e34;
  --accent:#c45c26; --ok:#7ea36b; --bad:#b54a4a; --card:#14181e;
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
  font:16px/1.5 "Segoe UI", sans-serif; }
.shell { display:grid; grid-template-columns:240px 1fr; min-height:100%; }
nav { border-right:1px solid var(--line); padding:22px 14px 40px; }
nav h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 18px; }
nav button { display:block; width:100%; text-align:left; background:transparent; border:0;
  color:var(--dim); padding:9px 10px; font:13px/1.35 inherit; cursor:pointer; }
nav button:hover, nav button.on { color:var(--fg); background:#1a1f26; }
nav button.on { box-shadow: inset 2px 0 0 var(--accent); }
.stage { padding:28px 36px 72px; max-width:920px; }
.kicker { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
h2 { font-size:26px; font-weight:650; margin:0 0 12px; }
.lede { color:var(--dim); max-width:64ch; margin:0 0 22px; }
.ask { background:var(--card); border:1px solid var(--line); padding:14px 16px; margin:0 0 18px; }
.ask strong { color:var(--accent); }
.out { color:var(--bad); }
.mch { color:var(--ok); }
button.next { margin-top:20px; background:var(--accent); color:#1a1008; border:0; padding:10px 16px; font:650 14px inherit; cursor:pointer; }
.foot { margin-top:28px; color:var(--dim); font-size:13px; }
kbd { font-family:ui-monospace,monospace; font-size:11px; border:1px solid var(--line); padding:1px 5px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { border-bottom:1px solid var(--line); text-align:left; padding:7px 8px; }
@media (max-width:820px) { .shell { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="shell">
<nav>
  <h1>Lessons</h1>
  <div id="toc"></div>
  <p class="foot"><kbd>j</kbd> / <kbd>k</kbd></p>
</nav>
<main class="stage" id="stage"><p class="lede">Loading lessons…</p></main>
</div>
<script>
(function () {
  var LESSONS = [
    { title: "Two steps", kicker: "Retrieve",
      lede: "This module finds passages in local manuals. It is not a chatbot. Step one: search. Step two: open the page. You do not skip step two.",
      ask: "Search returned a high number on a file. Are you done?",
      html: "<p class=\"lede out\">No. Open the page. Read the path and the lines. A high number on the wrong file is still the wrong file.</p>" },
    { title: "Two lists", kicker: "Do not add the scores",
      lede: "Word search finds pages that contain the tokens you typed. Meaning search finds pages whose fingerprint is close to the question. Keep them as two columns. Do not average them.",
      ask: "The tool prints one number that mixed both. What do you do?",
      html: "<table><thead><tr><th>Word list</th><th>Meaning list</th></tr></thead><tbody><tr><td>tokens you typed appear in the page</td><td>the 768-number fingerprint is close</td></tr></tbody></table><p class=\"lede out\">Do not treat the mixed number as the ranking. The extra word bonus is tiny. If meaning is wrong, words will not save you.</p>" },
    { title: "Not a chat question", kicker: "Detect",
      lede: "Asking the big local model to “just tell you” is a different door. Retrieve never goes there.",
      ask: "The transcript shows ask_omarchy on a lookup. Pass or fail?",
      html: "<p class=\"lede out\">Fail. Search, then open the page. Do not unload the chat model to run search. Embeddings use their own small model. Facts in the store may be empty; search still works.</p>" },
    { title: "Rebuild", kicker: "Setup",
      lede: "Charge the index once when the docs are verified. Then search. Setup steps live in SETUP.md next to this lesson.",
      ask: "Should you ingest and embed on every chat?",
      html: "<p class=\"lede out\">No. Ingest when the source lands. Embed once after that. Every lookup is search, then open.</p><p class=\"mch\">Directions: SETUP.md in this folder.</p>" }
  ];
  var toc = document.getElementById("toc");
  var stage = document.getElementById("stage");
  var i = 0;
  function render() {
    var buttons = toc.querySelectorAll("button");
    for (var n = 0; n < buttons.length; n++) buttons[n].classList.toggle("on", n === i);
    var L = LESSONS[i];
    stage.innerHTML = '<p class="kicker">' + L.kicker + " · " + (i + 1) + "/" + LESSONS.length + "</p>" +
      "<h2>" + L.title + "</h2><p class=\"lede\">" + L.lede + "</p>" +
      "<div class=\"ask\"><strong>Pause here.</strong> " + L.ask + "</div>" + L.html +
      "<button class=\"next\" type=\"button\">" + (i < LESSONS.length - 1 ? "Next lesson" : "Back to the start") + "</button>";
    stage.querySelector(".next").onclick = function () { i = (i + 1) % LESSONS.length; render(); };
  }
  LESSONS.forEach(function (L, n) {
    var b = document.createElement("button");
    b.textContent = (n + 1) + ". " + L.title;
    b.onclick = function () { i = n; render(); };
    toc.appendChild(b);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "j" || e.key === "ArrowRight") { i = Math.min(LESSONS.length - 1, i + 1); render(); }
    if (e.key === "k" || e.key === "ArrowLeft") { i = Math.max(0, i - 1); render(); }
  });
  render();
})();
</script>
</body>
</html>
