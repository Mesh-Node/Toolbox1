<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hop-80 — when the window is full</title>
<style>
:root {
  --bg:#0b0d10; --fg:#d8d2c4; --dim:#8a8376; --line:#2a2e34;
  --accent:#c45c26; --ok:#7ea36b; --bad:#b54a4a; --card:#14181e;
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
  font:16px/1.5 "Segoe UI", sans-serif; }
.shell { display:grid; grid-template-columns:240px 1fr; min-height:100%; }
nav { border-right:1px solid var(--line); padding:22px 14px 40px; }
nav h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 18px; }
nav button { display:block; width:100%; text-align:left; background:transparent; border:0;
  color:var(--dim); padding:9px 10px; font:13px/1.35 inherit; cursor:pointer; }
nav button:hover, nav button.on { color:var(--fg); background:#1a1f26; }
nav button.on { box-shadow: inset 2px 0 0 var(--accent); }
.stage { padding:28px 36px 72px; max-width:920px; }
.kicker { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
h2 { font-size:26px; font-weight:650; margin:0 0 12px; }
.lede { color:var(--dim); max-width:64ch; margin:0 0 22px; }
.ask { background:var(--card); border:1px solid var(--line); padding:14px 16px; margin:0 0 18px; }
.ask strong { color:var(--accent); }
.out { color:var(--bad); }
.mch { color:var(--ok); }
button.next { margin-top:20px; background:var(--accent); color:#1a1008; border:0; padding:10px 16px; font:650 14px inherit; cursor:pointer; }
.foot { margin-top:28px; color:var(--dim); font-size:13px; }
kbd { font-family:ui-monospace,monospace; font-size:11px; border:1px solid var(--line); padding:1px 5px; }
pre { background:#10141a; border:1px solid var(--line); padding:12px 14px; overflow:auto; font:13px/1.4 ui-monospace,monospace; color:var(--ok); }
@media (max-width:820px) { .shell { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="shell">
<nav>
  <h1>Lessons</h1>
  <div id="toc"></div>
  <p class="foot"><kbd>j</kbd> / <kbd>k</kbd></p>
</nav>
<main class="stage" id="stage"><p class="lede">Loading lessons…</p></main>
</div>
<script>
(function () {
  var LESSONS = [
    { title: "The window fills up", kicker: "Why hop",
      lede: "A long session uses more and more of the model’s memory. We do not auto-summarize that away. Compression stays off. Near 80% full, a hop can start a fresh session instead.",
      ask: "If the old session is 80% full, should it shrink the story into a paragraph?",
      html: "<p class=\"lede out\">No. That is compression. Hop-80 keeps the old session uncompressed and hands a short packet to a new session.</p>" },
    { title: "The packet is short on purpose", kicker: "What moves",
      lede: "The new session gets: the goal, which files are in scope, which are not, artifact paths, and a short trim. Files stay on disk. The packet names them.",
      ask: "Does the new session receive the old chat?",
      html: "<p class=\"lede out\">No. It does not get the conversation, passwords, or open browser tabs. If a file is not named, it must find it on disk or it does not have it.</p><pre>kind: hop\ngoal: TEXT\nin_scope:\n- PATH\nartifacts:\n- PATH\ntrim: TEXT</pre>" },
    { title: "Head and tail", kicker: "Direction",
      lede: "Head means forward: spawn a new session. Tail means back: put the packet into the origin. The origin stays unless the edge is head and leave is set. Close means one window address, never a class of windows.",
      ask: "Someone says “close all the terminals.” Is that a hop close?",
      html: "<p class=\"lede out\">No. Close is one address. The first command in the new session closes the sender that way.</p>" },
    { title: "Slogans are refused", kicker: "Detect",
      lede: "A hop needs a real goal. Empty cheers are not a goal.",
      ask: "The packet goal is “Continue. Inflate from disk.” What happens?",
      html: "<p class=\"lede out\">Refuse. Same for “Continue.” and “inflate from disk” alone. Write what to do and which files. Do not invent extra names for the hop. Do not use leftover radio slang for this step.</p>" }
  ];
  var toc = document.getElementById("toc");
  var stage = document.getElementById("stage");
  var i = 0;
  function render() {
    var buttons = toc.querySelectorAll("button");
    for (var n = 0; n < buttons.length; n++) buttons[n].classList.toggle("on", n === i);
    var L = LESSONS[i];
    stage.innerHTML = '<p class="kicker">' + L.kicker + " · " + (i + 1) + "/" + LESSONS.length + "</p>" +
      "<h2>" + L.title + "</h2><p class=\"lede\">" + L.lede + "</p>" +
      "<div class=\"ask\"><strong>Pause here.</strong> " + L.ask + "</div>" + L.html +
      "<button class=\"next\" type=\"button\">" + (i < LESSONS.length - 1 ? "Next lesson" : "Back to the start") + "</button>";
    stage.querySelector(".next").onclick = function () { i = (i + 1) % LESSONS.length; render(); };
  }
  LESSONS.forEach(function (L, n) {
    var b = document.createElement("button");
    b.textContent = (n + 1) + ". " + L.title;
    b.onclick = function () { i = n; render(); };
    toc.appendChild(b);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "j" || e.key === "ArrowRight") { i = Math.min(LESSONS.length - 1, i + 1); render(); }
    if (e.key === "k" || e.key === "ArrowLeft") { i = Math.max(0, i - 1); render(); }
  });
  render();
})();
</script>
</body>
</html>
